################################
## Clean sample names

extra_fn_clean_exts:
  - 'gcurve.txt'
  - '_sorted.markDups_matrix.tsv'
  - '_sorted'

###############################
## Modules 

module_order:
  - cutadapt:
      name: 'Trimming'
  - fastqc
  - umitools
  - bowtie1:
      name: 'rRNA Mapping'
      info: 'This section reports the fraction of reads aligned on ribosomal RNAs.'
      target: ''
      path_filters:
        - '*.log'
  - star
  - hisat2
  - qualimap
  - rseqc
  - featureCounts
  - htseq
  - salmon
  - preseq:
     name: 'Sequencing Complexity'
     info: 'estimates the complexity of a library, showing how many additional unique reads are sequenced for increasing total read count. A shallow curve indicates complexity saturation. The dashed line shows a perfectly complex library where total reads = unique reads. The presented graph shows extrapolated curves up to 200M sequencing reads.'
  - gffcompare

#############################
## Removed plots
remove_sections :
  - cutadapt_filtered_reads
  - fastqc_sequence_counts
  - fastqc_per_sequence_quality_scores
  - fastqc_overrepresented_sequences
  - fastqc_status_checks
  - umitools_extract_regex
  - umitools_extract_overall
  - plotFingerprint

#############################
## Display

report_section_order:
  stats:
    order: -1
  cutadapt:
    order: -10
  xengsort:
    order: -20
  fastqc:
    order: -30
  umitools:
    order: -35
  bowtie1:
    order: -40
  star:
    order: -50
  hisat2:
    order: -60
  qualimap:
    order: -70
  rseqc:
    order: -80
  preseq:
    order: -90
  gene_saturation:
    order: -100
  gene_type:
    order: -110
  DupRadar:
    order: -120 
  identitoPolym:
    order: -130
  featureCounts:
    order: -140
  htseq:
    order: -150
  salmon:
    order: -160
  sample-pca:
    order: -170
  sample-correlation:
    order: -180
  software_versions:
    order: -1000
  summary:
    order: -2000

table_columns_visible:
  FastQC:
    percent_duplicates: False

preseq:
   notrim: true

plots_force_interactive: True
