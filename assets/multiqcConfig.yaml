#
# RNA-seq config for MultiQC
#
###################

skip_generalstats: true
skip_versions_section: true
disable_version_detection: true
read_count_multiplier: 0.000001
read_count_prefix: 'M'
read_count_desc: 'millions'

###################################
## Custom content

custom_data:
    my_stats:
        file_format: 'csv'
        section_name: 'General Metrics'
        description: ' of sequenced data. High-quality RNA-seq experiments usually present a low ribosomal RNA fraction and a majority of uniquely aligned reads on coding sequences. All presented numbers are in fragments (i.e. in pairs for paired-end data).' 
        plot_type: 'table'
        pconfig:
            namespace: 'stats'
            id: 'stats'
            title: 'General Statistics'
            save_file: true
            col1_header: 'Sample ID'
        headers:
            Sample_name:
              title: 'Sample Name'
              scale: false
              format: '{:.0f}'
              placement: 2000
            Strandness:
              cond_formatting_rules:
                blue:
                  - s_eq: "auto"
                black:
                  - s_eq: "forward"
                grey:
                  - s_eq: "reverse"
              cond_formatting_colours:
                - grey: "#AAB7B8"
                - black: "#17202A"
              placement: 3000
            Number_of_frag:
              title: 'Total Fragments'
              scale: 'YlGnBu'
              format: '{:,.0f}'
              placement: 3500
            Percent_trimmed:
              title: 'Trimmed reads (%)'
              min: 0
              max: 100
              format: '{:,.1f}'
              suffix: '%'
              placement: 4000
            Number_pdx_graft:
              title: 'PDX Graft'
              format: '{:,.0f}'
              hidden: true
              placement: 4500
            Percent_pdx_graft:
              title: 'PDX Graft (%)'
              min: 0
              max: 100
              format: '{:,.1f}'
              suffix: '%'
              placement: 4600
            Number_pdx_host:
              title: 'PDX Host'
              format: '{:,.0f}'
              hidden: true
              placement: 4700
            Percent_pdx_host:
              title: 'PDX Host (%)'
              min: 0
              max: 100
              format: '{:,.1f}'
              suffix: '%'
              placement: 4800
            Number_of_rRNA:
              title: 'rRNA'
              scale: 'RdYlGn-rev'
              format: '{:,.0f}'
              hidden: true
              placement: 5000
            Percent_of_rRNA:
              title: 'rRNA (%)'
              min: 0
              max: 100
              scale: 'RdYlGn-rev'
              suffix: '%'
              format: '{:,.1f}'
              cond_formatting_rules:
                pass:
                  - lt: 10
                warn:
                  - gt: 10
                fail:
                  - gt: 20      
              placement: 6000
            Number_of_aligned:
              title: 'Aligned'
              scale: 'RdYlGn'
              format: '{:,.0f}'
              hidden: true
              placement: 7000
            Percent_of_aligned:
              title: 'Aligned (%)'
              min: 0
              max: 100
              scale: 'RdYlGn'
              suffix: '%'
              format: '{:,.1f}'
              cond_formatting_rules:
                pass:
                  - gt: 80
                warn:
                  - lt: 80
                fail:
                  - lt: 50
              placement: 8000
            Number_of_duplicates:
              title: 'Duplicates'
              scale: 'RdYlGn-rev'
              format: '{:,.0f}'
              hidden: true
              placement: 13000
            Percent_duplicates:
              title: 'Duplicates (%)'
              min: 0
              max: 100
              scale: 'RdYlGn-rev'
              suffix: '%'
              format: '{:,.1f}'
              cond_formatting_rules:
                pass:
                  - lt: 35
                warn:
                  - gt: 35
                fail:
                  - gt: 50   
              placement: 14000
            Percent_saturation:
              title: 'Saturation (%)'
              description: 'Estimation of saturation level'
              min: 0
              max: 100
              scale: 'RdYlGn-rev'
              suffix: '%'
              format: '{:,.1f}'
              placement: 15000
            Coding_genes:
              title: 'Coding genes'
              description: 'Number of coding genes detected'
              format: '{:,.0f}'
              cond_formatting_rules:
                pass:
                  - gt: 8000
                warn:
                  - lt: 8000
                fail:
                  - lt: 5000
              placement: 16000

    gene_type:
       file_format: 'csv'
       section_name: 'Expressed Genes'
       description: 'The number of expressed genes per sample was splitted into the 5 most abundant classes following the known gene annotations.'
       plot_type: 'bargraph'
       pconfig:
            id: 'genetype'
            title: 'Expressed Genes'
            ylab: 'Number of expressed genes (TPM>1)'

    gene_saturation:
       file_format: 'tsv'
       section_name: 'Gene-based saturation'
       description: 'plot showing the number of detected genes for a given set of subsampling values.'
       plot_type: 'linegraph'
       pconfig:
            id: 'genesaturation'
            title: 'Gene-based Saturation'
            ylab: 'Number of detected genes'
            xlab: 'Number of reads (M)'

    identitoPolym:
       file_format: 'tsv'
       section_name: 'Identito Monitoring'
       description: ' from a list of know polymorphisms.'
       plot_type: 'table'
       pconfig:
            title: 'Polymorphisms'
            id: 'polym'
            scale: 'RdYlBu'
            tt_decimals: 2
            save_file: true

    xengsort:
       file_format: 'tsv'
       section_name: 'Xengsort'
       description: 'is a fast lightweight accurate xenograft sorting able to distinguish host (ie. Mouse) to graft (ie. Human) sequencing reads.'
       plot_type: 'bargraph'
       pconfig:
            namespace: 'xengsort'
            id: 'xengsort'
            title: 'PDX'
            ylab: 'Number of reads'
            scale: 'Pastel1'


sp:
   my_stats:
      fn: '*mq.stats'
   gene_type:
      fn: '*genetype.txt'
   gene_saturation:
      fn: '*gcurve.txt'
   identitoPolym:
      fn: '*_polym.tsv'
   xengsort:
      fn: '*_xengsort.log'


